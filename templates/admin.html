<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>管理后台 - TokenGo</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    * { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: #000; color: #fff; min-height: 100vh; }
    a { color: inherit; text-decoration: none; }
    a:hover { opacity: 0.8; }
    .container { max-width: 1200px; margin: 0 auto; padding: 0 20px; }
    .btn { display: inline-block; padding: 6px 12px; border-radius: 6px; font-size: 14px; cursor: pointer; border: none; transition: all 0.2s; }
    .btn-primary { background: #10b981; color: #fff; }
    .btn-primary:hover { background: #059669; }
    .btn-secondary { background: #222; color: #fff; }
    .btn-secondary:hover { background: #333; }
    .btn-outline { background: transparent; border: 1px solid #333; color: #fff; }
    .btn-outline:hover { border-color: #555; }
    .btn-danger { background: #dc2626; color: #fff; }
    .btn-danger:hover { background: #b91c1c; }
    .input-field { background: #111; border: 1px solid #222; border-radius: 6px; padding: 8px 12px; color: #fff; font-size: 14px; }
    .input-field:focus { outline: none; border-color: #333; }
    .card { background: #111; border: 1px solid #222; border-radius: 8px; padding: 20px; }
    .stat-box { background: #111; border: 1px solid #222; border-radius: 8px; padding: 16px; }
    .nav-link { color: #555; text-decoration: none; transition: all 0.2s; padding: 8px 12px; border-radius: 6px; display: flex; align-items: center; gap: 8px; font-size: 14px; }
    .nav-link:hover { color: #fff; background: #111; }
    .nav-link.active { color: #10b981; background: #10b98110; }
    .section { display: none; }
    .section.active { display: block; }
    .table-style { width: 100%; border-collapse: collapse; }
    .table-style th { text-align: left; padding: 10px 12px; border-bottom: 1px solid #222; color: #555; font-weight: 500; font-size: 12px; background: #111; }
    .table-style td { padding: 10px 12px; border-bottom: 1px solid #222; font-size: 14px; }
    .table-style tr:hover { background: #111; }
    .badge { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 12px; background: #222; color: #888; }
    .badge-green { background: #10b98120; color: #10b981; }
    .badge-yellow { background: #eab30820; color: #eab308; }
    .badge-red { background: #ef444420; color: #ef4444; }
    .badge-blue { background: #3b82f620; color: #3b82f6; }
  </style>
</head>
<body>
  <!-- 导航栏 -->
  <nav class="fixed top-0 left-0 right-0 z-50 bg-black/90 backdrop-blur-md border-b border-zinc-800">
    <div class="container flex items-center justify-between h-14">
      <div class="flex items-center gap-4">
        <a href="/" class="flex items-center gap-2">
          <div class="w-8 h-8 rounded-lg bg-emerald-500 flex items-center justify-center font-bold text-lg">T</div>
          <span class="font-semibold">TokenGo</span>
        </a>
        <span class="text-xs bg-emerald-500/20 text-emerald-400 px-2 py-0.5 rounded">管理后台</span>
      </div>
      <div class="flex items-center gap-4">
        <a href="/" class="btn btn-secondary text-sm">返回首页</a>
        <button onclick="logout()" class="btn btn-secondary text-sm">退出</button>
      </div>
    </div>
  </nav>

  <!-- 主内容 -->
  <div class="pt-20 pb-12">
    <div class="container">
      <div class="flex gap-8">
        <!-- 侧边栏 -->
        <aside class="w-52 shrink-0 hidden md:block">
          <nav class="sticky top-20 space-y-1">
            <a href="#" class="nav-link active" onclick="showSection('dashboard', this)">数据概览</a>
            <a href="#" class="nav-link" onclick="showSection('users', this)">用户管理</a>
            <a href="#" class="nav-link" onclick="showSection('orders', this)">订单管理</a>
            <a href="#" class="nav-link" onclick="showSection('cards', this)">卡密管理</a>
            <a href="#" class="nav-link" onclick="showSection('payments', this)">支付配置</a>
            <a href="#" class="nav-link" onclick="showSection('settings', this)">系统设置</a>
          </nav>
        </aside>

        <!-- 内容区 -->
        <main class="flex-1 min-w-0">
          <!-- 数据概览 -->
          <section id="section-dashboard" class="section active">
            <h2 class="text-xl font-semibold mb-6">数据概览</h2>
            <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-8">
              <div class="stat-box">
                <div class="text-sm text-zinc-500">总用户</div>
                <div class="text-2xl font-bold text-emerald-500" id="statUsers">-</div>
              </div>
              <div class="stat-box">
                <div class="text-sm text-zinc-500">总订单</div>
                <div class="text-2xl font-bold text-blue-500" id="statOrders">-</div>
              </div>
              <div class="stat-box">
                <div class="text-sm text-zinc-500">总收入</div>
                <div class="text-2xl font-bold text-yellow-500" id="statRevenue">¥0</div>
              </div>
              <div class="stat-box">
                <div class="text-sm text-zinc-500">API调用</div>
                <div class="text-2xl font-bold text-purple-500" id="statCalls">-</div>
              </div>
            </div>
            <div class="card">
              <h3 class="font-medium mb-4">最近订单</h3>
              <table class="table-style">
                <thead>
                  <tr>
                    <th>订单号</th>
                    <th>用户</th>
                    <th>金额</th>
                    <th>状态</th>
                    <th>时间</th>
                  </tr>
                </thead>
                <tbody id="recentOrders"></tbody>
              </table>
            </div>
          </section>

          <!-- 用户管理 -->
          <section id="section-users" class="section">
            <div class="flex items-center justify-between mb-6">
              <h2 class="text-xl font-semibold">用户管理</h2>
              <div class="flex gap-3">
                <input type="text" id="userSearch" class="input-field w-64" placeholder="搜索邮箱..." oninput="searchUsers()">
                <button onclick="loadUsers()" class="btn btn-primary">刷新</button>
              </div>
            </div>
            <div class="card">
              <table class="table-style">
                <thead>
                  <tr>
                    <th>ID</th>
                    <th>邮箱</th>
                    <th>用户名</th>
                    <th>余额</th>
                    <th>角色</th>
                    <th>操作</th>
                  </tr>
                </thead>
                <tbody id="usersTable"></tbody>
              </table>
            </div>
          </section>

          <!-- 订单管理 -->
          <section id="section-orders" class="section">
            <div class="flex items-center justify-between mb-6">
              <h2 class="text-xl font-semibold">订单管理</h2>
              <select id="orderFilter" class="input-field" onchange="loadOrders()">
                <option value="">全部</option>
                <option value="pending">待处理</option>
                <option value="completed">已完成</option>
                <option value="rejected">已拒绝</option>
              </select>
            </div>
            <div class="card">
              <table class="table-style">
                <thead>
                  <tr>
                    <th>订单号</th>
                    <th>用户</th>
                    <th>金额</th>
                    <th>支付方式</th>
                    <th>状态</th>
                    <th>时间</th>
                    <th>操作</th>
                  </tr>
                </thead>
                <tbody id="ordersTable"></tbody>
              </table>
            </div>
          </section>

          <!-- 卡密管理 -->
          <section id="section-cards" class="section">
            <div class="flex items-center justify-between mb-6">
              <h2 class="text-xl font-semibold">卡密管理</h2>
              <button onclick="showModal()" class="btn btn-primary">+ 生成卡密</button>
            </div>
            <div class="grid grid-cols-3 gap-4 mb-6">
              <div class="stat-box">
                <div class="text-sm text-zinc-500">已生成</div>
                <div class="text-2xl font-bold" id="cardTotal">0</div>
              </div>
              <div class="stat-box">
                <div class="text-sm text-zinc-500">已使用</div>
                <div class="text-2xl font-bold text-emerald-500" id="cardUsed">0</div>
              </div>
              <div class="stat-box">
                <div class="text-sm text-zinc-500">未使用</div>
                <div class="text-2xl font-bold text-blue-500" id="cardUnused">0</div>
              </div>
            </div>
            <div class="card">
              <table class="table-style">
                <thead>
                  <tr>
                    <th>卡密</th>
                    <th>面值</th>
                    <th>状态</th>
                    <th>使用者</th>
                    <th>创建时间</th>
                  </tr>
                </thead>
                <tbody id="cardsTable"></tbody>
              </table>
            </div>
          </section>

          <!-- 支付配置 -->
          <section id="section-payments" class="section">
            <h2 class="text-xl font-semibold mb-6">支付配置</h2>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
              <div class="card">
                <h3 class="font-medium mb-4">💬 微信支付</h3>
                <div class="space-y-4">
                  <div class="border-2 border-dashed border-zinc-700 rounded-lg p-6 text-center cursor-pointer hover:border-emerald-500 transition-all" onclick="document.getElementById('wechatQr').click()">
                    <div id="wechatPreview" class="text-zinc-500">点击上传收款码</div>
                    <input type="file" id="wechatQr" class="hidden" accept="image/*" onchange="previewImage(this, 'wechatPreview')">
                  </div>
                  <input type="text" class="input-field w-full" placeholder="备注信息">
                  <button onclick="savePaymentConfig('wechat')" class="btn btn-primary w-full">保存</button>
                </div>
              </div>
              <div class="card">
                <h3 class="font-medium mb-4">💰 支付宝</h3>
                <div class="space-y-4">
                  <div class="border-2 border-dashed border-zinc-700 rounded-lg p-6 text-center cursor-pointer hover:border-emerald-500 transition-all" onclick="document.getElementById('alipayQr').click()">
                    <div id="alipayPreview" class="text-zinc-500">点击上传收款码</div>
                    <input type="file" id="alipayQr" class="hidden" accept="image/*" onchange="previewImage(this, 'alipayPreview')">
                  </div>
                  <input type="text" class="input-field w-full" placeholder="备注信息">
                  <button onclick="savePaymentConfig('alipay')" class="btn btn-primary w-full">保存</button>
                </div>
              </div>
            </div>
          </section>

          <!-- 系统设置 -->
          <section id="section-settings" class="section">
            <h2 class="text-xl font-semibold mb-6">系统设置</h2>
            <div class="card max-w-2xl space-y-6">
              <div>
                <h3 class="font-medium mb-4">基本设置</h3>
                <div class="grid grid-cols-2 gap-4">
                  <div>
                    <label class="block text-sm text-zinc-500 mb-2">网站名称</label>
                    <input type="text" class="input-field w-full" value="TokenGo">
                  </div>
                  <div>
                    <label class="block text-sm text-zinc-500 mb-2">网站地址</label>
                    <input type="text" class="input-field w-full" value="https://tokengo-d0cb.onrender.com">
                  </div>
                </div>
              </div>
              <div>
                <h3 class="font-medium mb-4">注册设置</h3>
                <label class="flex items-center gap-3 mb-3">
                  <input type="checkbox" class="accent-emerald-500" checked>
                  <span>允许新用户注册</span>
                </label>
                <div>
                  <label class="block text-sm text-zinc-500 mb-2">新用户赠送额度</label>
                  <input type="number" class="input-field w-32" value="1" step="0.1">
                </div>
              </div>
              <button onclick="saveSettings()" class="btn btn-primary">保存设置</button>
            </div>
          </section>
        </main>
      </div>
    </div>
  </div>

  <!-- 生成卡密弹窗 -->
  <div id="cardModal" class="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 hidden flex items-center justify-center">
    <div class="bg-zinc-900 border border-zinc-800 rounded-xl p-6 w-full max-w-md">
      <div class="flex items-center justify-between mb-4">
        <h3 class="text-lg font-semibold">生成卡密</h3>
        <button onclick="hideModal()" class="text-zinc-400 hover:text-white">✕</button>
      </div>
      <div class="space-y-4">
        <div>
          <label class="block text-sm text-zinc-500 mb-2">数量</label>
          <input type="number" id="cardCount" class="input-field w-full" value="1" min="1">
        </div>
        <div>
          <label class="block text-sm text-zinc-500 mb-2">面值 ($)</label>
          <input type="number" id="cardValue" class="input-field w-full" value="10" min="1">
        </div>
        <button onclick="generateCards()" class="btn btn-primary w-full">生成</button>
      </div>
      <div id="generatedCards" class="mt-4 space-y-2 hidden"></div>
    </div>
  </div>

  <script>
    let token = localStorage.getItem('token');
    if (!token) window.location.href = '/login';

    function getHeaders() {
      return { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' };
    }

    async function loadStats() {
      try {
        const res = await fetch('/api/admin/stats', { headers: getHeaders() });
        if (!res.ok) throw new Error();
        const data = await res.json();
        document.getElementById('statUsers').textContent = data.total_users || 0;
        document.getElementById('statOrders').textContent = data.total_orders || 0;
        document.getElementById('statRevenue').textContent = '¥' + (data.total_revenue || 0).toFixed(2);
        document.getElementById('statCalls').textContent = (data.total_calls || 0).toLocaleString();
        if (data.recent_orders) {
          document.getElementById('recentOrders').innerHTML = data.recent_orders.map(o => `
            <tr>
              <td class="font-mono text-xs">${o.id}</td>
              <td>${o.email}</td>
              <td>¥${o.amount}</td>
              <td><span class="badge badge-${o.status === 'completed' ? 'green' : o.status === 'pending' ? 'yellow' : 'red'}">${o.status}</span></td>
              <td>${new Date(o.created * 1000).toLocaleDateString()}</td>
            </tr>
          `).join('');
        }
      } catch (e) { console.error(e); }
    }

    async function loadUsers() {
      try {
        const res = await fetch('/api/admin/users', { headers: getHeaders() });
        const data = await res.json();
        if (data.users) {
          document.getElementById('usersTable').innerHTML = data.users.map(u => `
            <tr>
              <td class="font-mono text-xs">${u.id}</td>
              <td>${u.email}</td>
              <td>${u.username || '-'}</td>
              <td class="text-emerald-500">$${u.balance?.toFixed(2)}</td>
              <td><span class="badge badge-${u.role === 'admin' ? 'yellow' : 'blue'}">${u.role}</span></td>
              <td>
                <button onclick="editUser('${u.id}')" class="text-emerald-500 hover:text-emerald-400 mr-2">编辑</button>
                <button onclick="deleteUser('${u.id}')" class="text-red-500 hover:text-red-400">删除</button>
              </td>
            </tr>
          `).join('');
        }
      } catch (e) { console.error(e); }
    }

    async function loadOrders() {
      try {
        const filter = document.getElementById('orderFilter').value;
        const url = filter ? `/api/admin/orders?status=${filter}` : '/api/admin/orders';
        const res = await fetch(url, { headers: getHeaders() });
        const data = await res.json();
        if (data.orders) {
          document.getElementById('ordersTable').innerHTML = data.orders.map(o => `
            <tr>
              <td class="font-mono text-xs">${o.id}</td>
              <td>${o.email}</td>
              <td>¥${o.amount}</td>
              <td>${o.method}</td>
              <td><span class="badge badge-${o.status === 'completed' ? 'green' : o.status === 'pending' ? 'yellow' : 'red'}">${o.status}</span></td>
              <td>${new Date(o.created * 1000).toLocaleDateString()}</td>
              <td>${o.status === 'pending' ? `
                <button onclick="approveOrder('${o.id}')" class="text-emerald-500 hover:text-emerald-400 mr-2">通过</button>
                <button onclick="rejectOrder('${o.id}')" class="text-red-500 hover:text-red-400">拒绝</button>
              ` : '-'}</td>
            </tr>
          `).join('');
        }
      } catch (e) { console.error(e); }
    }

    async function loadCards() {
      try {
        const res = await fetch('/api/admin/cards', { headers: getHeaders() });
        const data = await res.json();
        document.getElementById('cardTotal').textContent = data.total || 0;
        document.getElementById('cardUsed').textContent = data.used || 0;
        document.getElementById('cardUnused').textContent = (data.total || 0) - (data.used || 0);
        if (data.cards) {
          document.getElementById('cardsTable').innerHTML = data.cards.map(c => `
            <tr>
              <td class="font-mono text-xs">${c.code}</td>
              <td class="text-emerald-500">$${c.value}</td>
              <td><span class="badge badge-${c.used ? 'green' : 'blue'}">${c.used ? '已使用' : '未使用'}</span></td>
              <td>${c.used_by || '-'}</td>
              <td>${new Date(c.created * 1000).toLocaleDateString()}</td>
            </tr>
          `).join('');
        }
      } catch (e) { console.error(e); }
    }

    function showSection(name, el) {
      document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
      document.querySelectorAll('.nav-link').forEach(l => l.classList.remove('active'));
      document.getElementById(`section-${name}`).classList.add('active');
      if (el) el.classList.add('active');
      if (name === 'users') loadUsers();
      else if (name === 'orders') loadOrders();
      else if (name === 'cards') loadCards();
      else if (name === 'dashboard') loadStats();
    }

    function showModal() { document.getElementById('cardModal').style.display = 'flex'; }
    function hideModal() { document.getElementById('cardModal').style.display = 'none'; }

    async function generateCards() {
      const count = parseInt(document.getElementById('cardCount').value);
      const value = parseFloat(document.getElementById('cardValue').value);
      try {
        const res = await fetch('/api/admin/cards/generate', {
          method: 'POST', headers: getHeaders(), body: JSON.stringify({ count, value })
        });
        const data = await res.json();
        if (data.cards) {
          document.getElementById('generatedCards').classList.remove('hidden');
          document.getElementById('generatedCards').innerHTML = data.cards.map(c => `
            <div class="p-3 bg-zinc-800 rounded flex items-center justify-between">
              <span class="font-mono text-sm">${c}</span>
              <button onclick="copyText('${c}')" class="text-xs text-emerald-500">复制</button>
            </div>
          `).join('');
          loadCards();
        }
      } catch (e) { alert('生成失败'); }
    }

    function copyText(text) { navigator.clipboard.writeText(text); alert('已复制'); }
    async function approveOrder(id) { await fetch(`/api/admin/orders/${id}/approve`, { method: 'POST', headers: getHeaders() }); loadOrders(); loadStats(); }
    async function rejectOrder(id) { await fetch(`/api/admin/orders/${id}/reject`, { method: 'POST', headers: getHeaders() }); loadOrders(); }
    async function editUser(id) { const balance = prompt('新余额:'); if (balance !== null) { await fetch(`/api/admin/users/${id}`, { method: 'PUT', headers: getHeaders(), body: JSON.stringify({ balance: parseFloat(balance) }) }); loadUsers(); } }
    async function deleteUser(id) { if (confirm('确定删除?')) { await fetch(`/api/admin/users/${id}`, { method: 'DELETE', headers: getHeaders() }); loadUsers(); } }
    function savePaymentConfig(type) { alert(`${type} 配置已保存`); }
    function saveSettings() { alert('设置已保存'); }
    function previewImage(input, previewId) { const file = input.files[0]; if (file) { const reader = new FileReader(); reader.onload = function(e) { document.getElementById(previewId).innerHTML = `<img src="${e.target.result}" class="max-h-32 mx-auto">`; }; reader.readAsDataURL(file); } }
    function searchUsers() { const keyword = document.getElementById('userSearch').value.toLowerCase(); document.querySelectorAll('#usersTable tr').forEach(row => { row.style.display = row.textContent.toLowerCase().includes(keyword) ? '' : 'none'; }); }
    function logout() { localStorage.removeItem('token'); window.location.href = '/'; }

    loadStats();
  </script>
</body>
</html>
