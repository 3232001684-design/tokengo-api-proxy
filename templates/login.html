<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>登录 - TokenGo</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    * { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: #fff; color: #1a1a1a; min-height: 100vh; }
    .btn { display: inline-block; padding: 10px 24px; border-radius: 6px; font-size: 14px; cursor: pointer; border: none; transition: all 0.2s; width: 100%; }
    .btn-primary { background: #10b981; color: #fff; }
    .btn-primary:hover { background: #059669; }
    .input-field { background: #fff; border: 1px solid #d1d5db; border-radius: 6px; padding: 12px 16px; color: #1a1a1a; width: 100%; font-size: 14px; transition: all 0.2s; }
    .input-field:focus { outline: none; border-color: #10b981; }
    .input-field::placeholder { color: #9ca3af; }
    .tab-btn { padding: 12px 24px; font-weight: 500; color: #6b7280; border-bottom: 2px solid transparent; transition: all 0.2s; cursor: pointer; }
    .tab-btn.active { color: #10b981; border-bottom-color: #10b981; }
    .text-muted { color: #6b7280; }
  </style>
</head>
<body>
  <!-- 导航栏 -->
  <nav class="bg-white border-b border-gray-200">
    <div class="max-w-6xl mx-auto px-6 flex items-center justify-between h-14">
      <a href="/" class="flex items-center gap-2">
        <div class="w-8 h-8 rounded-lg bg-emerald-500 flex items-center justify-center font-bold text-lg text-white">T</div>
        <span class="font-semibold">TokenGo</span>
      </a>
    </div>
  </nav>

  <!-- 登录表单 -->
  <div class="min-h-[calc(100vh-56px)] flex items-center justify-center p-6">
    <div class="w-full max-w-sm">
      <!-- Tab 切换 -->
      <div class="flex border-b border-gray-200 mb-8">
        <button id="tabLogin" class="tab-btn active" onclick="switchTab('login')">登录</button>
        <button id="tabRegister" class="tab-btn" onclick="switchTab('register')">注册</button>
      </div>

      <!-- 登录表单 -->
      <form id="loginForm" onsubmit="handleLogin(event)">
        <div class="space-y-4">
          <div>
            <input type="email" name="email" class="input-field" placeholder="邮箱" required>
          </div>
          <div>
            <input type="password" name="password" class="input-field" placeholder="密码" required>
          </div>
          <button type="submit" class="btn btn-primary mt-4">登录</button>
        </div>
      </form>

      <!-- 注册表单 -->
      <form id="registerForm" onsubmit="handleRegister(event)" class="hidden">
        <div class="space-y-4">
          <div>
            <input type="email" name="email" class="input-field" placeholder="邮箱" required>
          </div>
          <div>
            <input type="password" name="password" class="input-field" placeholder="密码" required minlength="6">
          </div>
          <div>
            <input type="password" name="confirmPassword" class="input-field" placeholder="确认密码" required>
          </div>
          <div>
            <input type="text" name="inviteCode" class="input-field" placeholder="邀请码（选填）">
          </div>
          <button type="submit" class="btn btn-primary mt-4">注册</button>
        </div>
      </form>

      <!-- 提示 -->
      <div class="mt-6 text-center text-sm text-muted">
        <a href="/" class="hover:text-emerald-500">返回首页</a>
      </div>

      <!-- 消息提示 -->
      <div id="message" class="hidden mt-4 p-4 rounded-lg text-sm"></div>
    </div>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.get('mode') === 'register') switchTab('register');

    function switchTab(tab) {
      document.getElementById('loginForm').classList.toggle('hidden', tab !== 'login');
      document.getElementById('registerForm').classList.toggle('hidden', tab !== 'register');
      document.getElementById('tabLogin').classList.toggle('active', tab === 'login');
      document.getElementById('tabRegister').classList.toggle('active', tab === 'register');
      document.getElementById('message').classList.add('hidden');
    }

    function showMessage(text, type) {
      const msg = document.getElementById('message');
      msg.textContent = text;
      msg.className = `mt-4 p-4 rounded-lg text-sm ${type === 'error' ? 'bg-red-50 text-red-600 border border-red-200' : 'bg-emerald-50 text-emerald-600 border border-emerald-200'}`;
      msg.classList.remove('hidden');
    }

    async function handleLogin(e) {
      e.preventDefault();
      const form = e.target;
      try {
        const res = await fetch('/api/auth/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ email: form.email.value, password: form.password.value }) });
        const data = await res.json();
        if (res.ok) { localStorage.setItem('token', data.token); window.location.href = '/dashboard'; }
        else showMessage(data.detail || '登录失败', 'error');
      } catch { showMessage('网络错误', 'error'); }
    }

    async function handleRegister(e) {
      e.preventDefault();
      const form = e.target;
      if (form.password.value !== form.confirmPassword.value) { showMessage('两次密码不一致', 'error'); return; }
      try {
        const res = await fetch('/api/auth/register', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ email: form.email.value, password: form.password.value, invite_code: form.inviteCode.value || undefined }) });
        const data = await res.json();
        if (res.ok) { localStorage.setItem('token', data.token); window.location.href = '/dashboard'; }
        else showMessage(data.detail || '注册失败', 'error');
      } catch { showMessage('网络错误', 'error'); }
    }
  </script>
</body>
</html>
