<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>登录 - TokenGo</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    * { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    :root {
      --primary: #10b981;
      --bg: #09090b;
      --card: #18181b;
      --border: #27272a;
      --text: #fafafa;
      --muted: #a1a1aa;
    }
    body { background: var(--bg); color: var(--text); min-height: 100vh; }
    .btn-primary { background: var(--primary); color: white; padding: 12px 24px; border-radius: 8px; font-weight: 500; border: none; cursor: pointer; transition: all 0.2s; width: 100%; }
    .btn-primary:hover { background: #059669; }
    .input-field { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 12px 16px; color: var(--text); width: 100%; transition: all 0.2s; }
    .input-field:focus { outline: none; border-color: var(--primary); }
    .input-field::placeholder { color: var(--muted); }
    .live-dot { width: 8px; height: 8px; background: var(--primary); border-radius: 50%; animation: pulse 2s infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
    .tab-btn { padding: 12px 24px; font-weight: 500; color: var(--muted); border-bottom: 2px solid transparent; transition: all 0.2s; cursor: pointer; }
    .tab-btn.active { color: var(--primary); border-bottom-color: var(--primary); }
    .tab-btn:hover { color: var(--text); }
  </style>
</head>
<body>
  <!-- 导航栏 -->
  <nav class="border-b border-zinc-800 bg-black/80 backdrop-blur-md">
    <div class="max-w-6xl mx-auto px-6 h-16 flex items-center justify-between">
      <a href="/" class="flex items-center gap-2">
        <div class="w-8 h-8 rounded-lg bg-emerald-500 flex items-center justify-center text-lg">🚀</div>
        <span class="text-lg font-semibold">TokenGo</span>
      </a>
      <div class="flex items-center gap-2">
        <span class="live-dot"></span>
        <span class="text-sm text-emerald-400">服务正常</span>
      </div>
    </div>
  </nav>

  <!-- 登录表单 -->
  <div class="min-h-[calc(100vh-64px)] flex items-center justify-center p-6">
    <div class="w-full max-w-md">
      <!-- Logo -->
      <div class="text-center mb-8">
        <div class="w-16 h-16 rounded-2xl bg-emerald-500 flex items-center justify-center text-3xl mx-auto mb-4">🚀</div>
        <h1 class="text-2xl font-bold">欢迎回来</h1>
        <p class="text-zinc-400 mt-2">登录到您的 TokenGo 账户</p>
      </div>

      <!-- Tab 切换 -->
      <div class="flex border-b border-zinc-800 mb-6">
        <button id="tabLogin" class="tab-btn active" onclick="switchTab('login')">登录</button>
        <button id="tabRegister" class="tab-btn" onclick="switchTab('register')">注册</button>
      </div>

      <!-- 登录表单 -->
      <form id="loginForm" onsubmit="handleLogin(event)">
        <div class="space-y-4">
          <div>
            <label class="block text-sm text-zinc-400 mb-2">邮箱</label>
            <input type="email" name="email" class="input-field" placeholder="your@email.com" required>
          </div>
          <div>
            <label class="block text-sm text-zinc-400 mb-2">密码</label>
            <input type="password" name="password" class="input-field" placeholder="••••••••" required>
          </div>
          <div class="flex items-center justify-between text-sm">
            <label class="flex items-center gap-2 cursor-pointer">
              <input type="checkbox" class="w-4 h-4 rounded border-zinc-700 bg-zinc-800 accent-emerald-500">
              <span class="text-zinc-400">记住我</span>
            </label>
            <a href="#" class="text-emerald-400 hover:text-emerald-300">忘记密码？</a>
          </div>
          <button type="submit" class="btn-primary">登录</button>
        </div>
      </form>

      <!-- 注册表单 -->
      <form id="registerForm" onsubmit="handleRegister(event)" class="hidden">
        <div class="space-y-4">
          <div>
            <label class="block text-sm text-zinc-400 mb-2">邮箱</label>
            <input type="email" name="email" class="input-field" placeholder="your@email.com" required>
          </div>
          <div>
            <label class="block text-sm text-zinc-400 mb-2">密码</label>
            <input type="password" name="password" class="input-field" placeholder="至少 6 位" required minlength="6">
          </div>
          <div>
            <label class="block text-sm text-zinc-400 mb-2">确认密码</label>
            <input type="password" name="confirmPassword" class="input-field" placeholder="再次输入密码" required>
          </div>
          <div>
            <label class="block text-sm text-zinc-400 mb-2">邀请码（选填）</label>
            <input type="text" name="inviteCode" class="input-field" placeholder="如有邀请码请输入">
          </div>
          <button type="submit" class="btn-primary">注册</button>
        </div>
      </form>

      <!-- 提示 -->
      <div class="mt-6 text-center text-sm text-zinc-500">
        登录即表示同意我们的 <a href="#" class="text-emerald-400 hover:text-emerald-300">服务条款</a>
      </div>

      <!-- 错误/成功提示 -->
      <div id="message" class="hidden mt-4 p-4 rounded-lg text-sm"></div>
    </div>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const mode = urlParams.get('mode');
    
    if (mode === 'register') {
      switchTab('register');
    }

    function switchTab(tab) {
      const loginForm = document.getElementById('loginForm');
      const registerForm = document.getElementById('registerForm');
      const tabLogin = document.getElementById('tabLogin');
      const tabRegister = document.getElementById('tabRegister');
      const message = document.getElementById('message');
      
      message.classList.add('hidden');
      
      if (tab === 'login') {
        loginForm.classList.remove('hidden');
        registerForm.classList.add('hidden');
        tabLogin.classList.add('active');
        tabRegister.classList.remove('active');
      } else {
        loginForm.classList.add('hidden');
        registerForm.classList.remove('hidden');
        tabLogin.classList.remove('active');
        tabRegister.classList.add('active');
      }
    }

    function showMessage(text, type) {
      const message = document.getElementById('message');
      message.textContent = text;
      message.className = `mt-4 p-4 rounded-lg text-sm ${type === 'error' ? 'bg-red-500/20 text-red-400 border border-red-500/30' : 'bg-emerald-500/20 text-emerald-400 border border-emerald-500/30'}`;
      message.classList.remove('hidden');
    }

    async function handleLogin(e) {
      e.preventDefault();
      const form = e.target;
      const data = {
        email: form.email.value,
        password: form.password.value
      };
      
      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data)
        });
        const result = await res.json();
        
        if (res.ok) {
          localStorage.setItem('token', result.token);
          showMessage('登录成功！正在跳转...', 'success');
          setTimeout(() => window.location.href = '/dashboard', 1000);
        } else {
          showMessage(result.detail || '登录失败', 'error');
        }
      } catch (err) {
        showMessage('网络错误，请重试', 'error');
      }
    }

    async function handleRegister(e) {
      e.preventDefault();
      const form = e.target;
      
      if (form.password.value !== form.confirmPassword.value) {
        showMessage('两次密码输入不一致', 'error');
        return;
      }
      
      const data = {
        email: form.email.value,
        password: form.password.value,
        invite_code: form.inviteCode.value || undefined
      };
      
      try {
        const res = await fetch('/api/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data)
        });
        const result = await res.json();
        
        if (res.ok) {
          localStorage.setItem('token', result.token);
          showMessage('注册成功！正在跳转...', 'success');
          setTimeout(() => window.location.href = '/dashboard', 1000);
        } else {
          showMessage(result.detail || '注册失败', 'error');
        }
      } catch (err) {
        showMessage('网络错误，请重试', 'error');
      }
    }
  </script>
</body>
</html>
