<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TokenGo - 登录 / 注册</title>
  <link rel="stylesheet" href="/static/css/vendor.css" />
  <link rel="stylesheet" href="/static/css/ccvibe.css" />
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
    }
    .login-wrapper {
      width: 100%;
      max-width: 420px;
      padding: 20px;
    }
  </style>
</head>
<body>
  <div class="login-wrapper">
    <div class="text-center mb-8">
      <a href="/" class="text-3xl font-extrabold text-teal-600 flex items-center justify-center gap-2">🚀 TokenGo</a>
      <p class="text-gray-500 mt-2">一个密钥，畅用多个 AI 模型</p>
    </div>
    
    <div class="card p-8 shadow-xl">
      <div class="flex gap-4 mb-6 border-b border-gray-200">
        <button id="tabLogin" class="flex-1 py-3 text-center font-semibold border-b-2 border-teal-500 text-teal-600" onclick="switchTab('login')">登录</button>
        <button id="tabRegister" class="flex-1 py-3 text-center font-semibold border-b-2 border-transparent text-gray-500" onclick="switchTab('register')">注册</button>
      </div>
      
      <form id="loginForm" onsubmit="handleLogin(event)">
        <div class="mb-4">
          <label class="block text-sm font-medium text-gray-700 mb-1.5">邮箱</label>
          <input type="email" id="loginEmail" class="input w-full" placeholder="your@email.com" required />
        </div>
        <div class="mb-4">
          <label class="block text-sm font-medium text-gray-700 mb-1.5">密码</label>
          <input type="password" id="loginPassword" class="input w-full" placeholder="••••••••" required />
        </div>
        <div class="flex items-center justify-between mb-6">
          <label class="flex items-center gap-2 text-sm text-gray-600">
            <input type="checkbox" id="rememberMe" class="rounded border-gray-300" />
            记住我
          </label>
          <a href="#" class="text-sm text-teal-600 hover:text-teal-700">忘记密码?</a>
        </div>
        <button type="submit" id="loginBtn" class="btn btn-primary w-full">登录</button>
      </form>
      
      <form id="registerForm" onsubmit="handleRegister(event)" style="display:none">
        <div class="mb-4">
          <label class="block text-sm font-medium text-gray-700 mb-1.5">用户名</label>
          <input type="text" id="regUsername" class="input w-full" placeholder="请输入用户名" required />
        </div>
        <div class="mb-4">
          <label class="block text-sm font-medium text-gray-700 mb-1.5">邮箱</label>
          <input type="email" id="regEmail" class="input w-full" placeholder="your@email.com" required />
        </div>
        <div class="mb-4">
          <label class="block text-sm font-medium text-gray-700 mb-1.5">密码</label>
          <input type="password" id="regPassword" class="input w-full" placeholder="至少8位字符" required />
        </div>
        <div class="mb-6">
          <label class="block text-sm font-medium text-gray-700 mb-1.5">确认密码</label>
          <input type="password" id="regConfirm" class="input w-full" placeholder="再次输入密码" required />
        </div>
        <button type="submit" id="registerBtn" class="btn btn-primary w-full">注册</button>
      </form>
      
      <div class="mt-6 text-center text-sm text-gray-500">
        <div class="flex items-center justify-center gap-2 mb-4">
          <div class="flex-1 h-px bg-gray-200"></div>
          <span>或</span>
          <div class="flex-1 h-px bg-gray-200"></div>
        </div>
        <a href="/redeem" class="text-teal-600 hover:text-teal-700">🎫 使用卡密兑换（无需注册）</a>
      </div>
    </div>
    
    <div class="mt-6 text-center text-sm text-gray-500">
      <p>已有账号? <a href="/login" class="text-teal-600 hover:text-teal-700">立即登录</a></p>
    </div>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const mode = urlParams.get('mode');
    if(mode === 'register') switchTab('register');

    function switchTab(tab) {
      const loginForm = document.getElementById('loginForm');
      const registerForm = document.getElementById('registerForm');
      const tabLogin = document.getElementById('tabLogin');
      const tabRegister = document.getElementById('tabRegister');

      if(tab === 'login') {
        loginForm.style.display = 'block';
        registerForm.style.display = 'none';
        tabLogin.className = 'flex-1 py-3 text-center font-semibold border-b-2 border-teal-500 text-teal-600';
        tabRegister.className = 'flex-1 py-3 text-center font-semibold border-b-2 border-transparent text-gray-500';
      } else {
        loginForm.style.display = 'none';
        registerForm.style.display = 'block';
        tabLogin.className = 'flex-1 py-3 text-center font-semibold border-b-2 border-transparent text-gray-500';
        tabRegister.className = 'flex-1 py-3 text-center font-semibold border-b-2 border-teal-500 text-teal-600';
      }
    }

    async function handleLogin(e) {
      e.preventDefault();
      const btn = document.getElementById('loginBtn');
      const email = document.getElementById('loginEmail').value;
      const password = document.getElementById('loginPassword').value;
      const urlParams = new URLSearchParams(window.location.search);
      const redirect = urlParams.get('redirect') || '/dashboard';
      
      btn.disabled = true;
      btn.innerHTML = '登录中...';
      
      try {
        const r = await fetch('/api/auth/login', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({email, password})
        });
        const data = await r.json();
        
        if(r.ok) {
          localStorage.setItem('tg_session', data.session_token);
          window.location.href = redirect;
        } else {
          alert(data.detail || '登录失败');
        }
      } catch(err) {
        alert('网络错误，请稍后重试: ' + err.message);
      } finally {
        btn.disabled = false;
        btn.innerHTML = '登录';
      }
    }

    async function handleRegister(e) {
      e.preventDefault();
      const btn = document.getElementById('registerBtn');
      const username = document.getElementById('regUsername').value;
      const email = document.getElementById('regEmail').value;
      const password = document.getElementById('regPassword').value;
      const confirm = document.getElementById('regConfirm').value;
      
      if(password !== confirm) {
        alert('两次输入的密码不一致');
        return;
      }
      if(password.length < 8) {
        alert('密码至少需要8位');
        return;
      }
      
      btn.disabled = true;
      btn.innerHTML = '注册中...';
      
      try {
        const r = await fetch('/api/auth/register', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({username, email, password})
        });
        const data = await r.json();
        
        if(r.ok) {
          localStorage.setItem('tg_session', data.session_token);
          alert('注册成功！已获得 $1 试用额度');
          window.location.href = '/dashboard';
        } else {
          alert(data.detail || '注册失败');
        }
      } catch(err) {
        alert('网络错误，请稍后重试: ' + err.message);
      } finally {
        btn.disabled = false;
        btn.innerHTML = '注册';
      }
    }
  </script>
</body>
</html>
