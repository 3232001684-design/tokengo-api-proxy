<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TokenGo - 卡密兑换</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #14b8a6;
      --primary-light: #2dd4bf;
      --primary-dark: #0d9488;
      --bg-dark: #0f172a;
      --bg-card: #1e293b;
      --text-primary: #f1f5f9;
      --text-secondary: #94a3b8;
      --border: #334155;
    }
    body {
      background-color: var(--bg-dark);
      color: var(--text-primary);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .nav-link {
      color: var(--text-secondary);
      text-decoration: none;
      transition: color 0.2s;
    }
    .nav-link:hover {
      color: var(--primary);
    }
    .stat-card {
      background: linear-gradient(180deg, rgba(15, 24, 43, 0.94) 0%, rgba(6, 13, 24, 0.94) 100%);
      border: 1px solid rgba(20, 184, 166, 0.16);
      box-shadow: inset 0 1px rgba(45, 212, 191, 0.06), 0 6px 24px rgba(0, 0, 0, 0.36);
      backdrop-filter: blur(10px);
      border-radius: 1rem;
      padding: 1.75rem;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .stat-card:hover {
      border-color: rgba(45, 212, 191, 0.56);
      box-shadow: inset 0 1px rgba(45, 212, 191, 0.12), 0 0 26px rgba(20, 184, 166, 0.18), 0 10px 34px rgba(0, 0, 0, 0.4);
    }
    .input-field {
      width: 100%;
      padding: 0.75rem 1rem;
      border: 1px solid var(--border);
      border-radius: 0.75rem;
      font-size: 0.875rem;
      background: var(--bg-dark);
      color: var(--text-primary);
      transition: all 0.2s ease;
    }
    .input-field:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(20, 184, 166, 0.1);
    }
    .input-field::placeholder {
      color: var(--text-secondary);
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      border-radius: 0.75rem;
      padding: 0.625rem 1.25rem;
      font-size: 0.875rem;
      line-height: 1.25rem;
      font-weight: 500;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      border: none;
      cursor: pointer;
    }
    .btn-primary {
      background: linear-gradient(to right, var(--primary), var(--primary-dark));
      color: white;
      box-shadow: 0 4px 6px -1px rgba(20, 184, 166, 0.25);
    }
    .btn-primary:hover {
      background: linear-gradient(to right, var(--primary-dark), #0f766e);
      box-shadow: 0 10px 15px -3px rgba(20, 184, 166, 0.3);
    }
    .btn-primary:disabled {
      opacity: 0.7;
      cursor: not-allowed;
      transform: none;
    }
    .btn-secondary {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-primary);
      box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
    }
    .btn-secondary:hover {
      background: var(--bg-card);
      border-color: var(--text-secondary);
    }
    .live-dot {
      position: relative;
      display: inline-block;
      height: 0.5rem;
      width: 0.5rem;
      border-radius: 9999px;
      background-color: var(--primary);
    }
    .live-dot::after {
      content: "";
      position: absolute;
      top: 0;
      right: 0;
      bottom: 0;
      left: 0;
      border-radius: 9999px;
      background-color: var(--primary-light);
      animation: livePulse 1.8s ease-out infinite;
    }
    @keyframes livePulse {
      0% { transform: scale(1); opacity: 0.7; }
      to { transform: scale(2.6); opacity: 0; }
    }
    .alert {
      padding: 1rem;
      border-radius: 0.75rem;
      margin-bottom: 1rem;
      display: none;
    }
    .alert-success {
      background: rgba(16, 185, 129, 0.15);
      color: #10b981;
      border: 1px solid rgba(16, 185, 129, 0.3);
    }
    .alert-error {
      background: rgba(239, 68, 68, 0.15);
      color: #ef4444;
      border: 1px solid rgba(239, 68, 68, 0.3);
    }
    .card-icon {
      width: 64px;
      height: 64px;
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      border-radius: 1rem;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      margin: 0 auto 1.5rem;
    }
  </style>
</head>
<body>
  <nav class="bg-[var(--bg-dark)] border-b border-[var(--border)]">
    <div class="container mx-auto px-6 h-16 flex items-center justify-between">
      <a href="/" class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-lg bg-gradient-to-br from-teal-500 to-teal-600 flex items-center justify-center text-xl">🚀</div>
        <span class="text-xl font-bold text-white">TokenGo</span>
      </a>
      <div class="flex items-center gap-6">
        <a href="/" class="nav-link">首页</a>
        <a href="/dashboard" class="nav-link">控制台</a>
        <a href="/help" class="nav-link">使用帮助</a>
        <a href="/login" class="btn btn-primary">登录</a>
      </div>
    </div>
  </nav>

  <main class="flex-1 flex items-center justify-center py-12">
    <div class="container mx-auto px-6 max-w-md">
      <div class="stat-card text-center">
        <div class="card-icon">🎫</div>
        <h1 class="text-2xl font-bold text-white mb-2">卡密兑换</h1>
        <p class="text-[var(--text-secondary)] mb-6">输入您的卡密，兑换 API 额度</p>

        <div id="alertSuccess" class="alert alert-success">
          ✅ 兑换成功！额度已添加到您的账户
        </div>
        <div id="alertError" class="alert alert-error">
          ❌ 兑换失败，请检查卡密是否正确
        </div>

        <form id="redeemForm" onsubmit="handleRedeem(event)">
          <div class="mb-4">
            <label class="block text-left text-sm font-medium text-[var(--text-secondary)] mb-2">
              卡密
            </label>
            <input 
              type="text" 
              id="cardCode" 
              class="input-field text-center font-mono text-lg tracking-wider" 
              placeholder="TG-XXXX-XXXX-XXXX"
              style="text-transform: uppercase;"
              required
            />
          </div>

          <div class="mb-6">
            <label class="block text-left text-sm font-medium text-[var(--text-secondary)] mb-2">
              邮箱（可选，已登录用户自动使用）
            </label>
            <input 
              type="email" 
              id="email" 
              class="input-field" 
              placeholder="your@email.com"
            />
          </div>

          <button type="submit" id="redeemBtn" class="btn btn-primary w-full mb-4">
            🎫 立即兑换
          </button>

          <div class="text-center text-sm text-[var(--text-secondary)]">
            <p>没有卡密？<a href="/login" class="text-[var(--primary)] hover:underline">登录购买</a></p>
          </div>
        </form>

        <div class="mt-8 pt-6 border-t border-[var(--border)]">
          <div class="flex items-center justify-center gap-2 text-sm text-[var(--text-secondary)]">
            <span class="live-dot"></span>
            <span>卡密兑换即时到账</span>
          </div>
        </div>
      </div>

      <div class="mt-6 text-center">
        <a href="/" class="btn btn-secondary">← 返回首页</a>
      </div>
    </div>
  </main>

  <footer class="border-t border-[var(--border)] py-6">
    <div class="container mx-auto px-6 text-center text-[var(--text-secondary)] text-sm">
      <p>© 2026 TokenGo. All rights reserved.</p>
    </div>
  </footer>

  <script>
    async function checkLogin() {
      const token = localStorage.getItem('tg_session');
      if (token) {
        try {
          const r = await fetch('/api/auth/me', { headers: { 'Authorization': 'Bearer ' + token } });
          if (r.ok) {
            const user = await r.json();
            document.getElementById('email').value = user.email || '';
            document.querySelector('nav').innerHTML = `
              <div class="container mx-auto px-6 h-16 flex items-center justify-between">
                <a href="/" class="flex items-center gap-3">
                  <div class="w-10 h-10 rounded-lg bg-gradient-to-br from-teal-500 to-teal-600 flex items-center justify-center text-xl">🚀</div>
                  <span class="text-xl font-bold text-white">TokenGo</span>
                </a>
                <div class="flex items-center gap-6">
                  <a href="/" class="nav-link">首页</a>
                  <a href="/dashboard" class="nav-link">控制台</a>
                  <a href="/help" class="nav-link">使用帮助</a>
                  <a href="/dashboard" class="btn btn-primary">${user.username || user.email}</a>
                </div>
              </div>
            `;
          }
        } catch(e) {}
      }
    }

    async function handleRedeem(e) {
      e.preventDefault();
      
      const btn = document.getElementById('redeemBtn');
      const code = document.getElementById('cardCode').value.trim().toUpperCase();
      const email = document.getElementById('email').value.trim();
      
      const alertSuccess = document.getElementById('alertSuccess');
      const alertError = document.getElementById('alertError');
      
      alertSuccess.style.display = 'none';
      alertError.style.display = 'none';
      
      btn.disabled = true;
      btn.innerHTML = '兑换中...';
      
      const token = localStorage.getItem('tg_session');
      const headers = { 'Content-Type': 'application/json' };
      if (token) {
        headers['Authorization'] = 'Bearer ' + token;
      }
      
      try {
        const r = await fetch('/api/redeem', {
          method: 'POST',
          headers: headers,
          body: JSON.stringify({ code, email })
        });
        
        const data = await r.json();
        
        if (r.ok) {
          alertSuccess.textContent = `✅ 兑换成功！已获得 $${data.added || '额度'} 到账`;
          alertSuccess.style.display = 'block';
          document.getElementById('cardCode').value = '';
        } else {
          alertError.textContent = `❌ ${data.detail || '兑换失败，请检查卡密是否正确'}`;
          alertError.style.display = 'block';
        }
      } catch(err) {
        alertError.textContent = '❌ 网络错误，请稍后重试';
        alertError.style.display = 'block';
      } finally {
        btn.disabled = false;
        btn.innerHTML = '🎫 立即兑换';
      }
    }

    checkLogin();
  </script>
</body>
</html>
