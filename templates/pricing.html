    * { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: #000; color: #fff; min-height: 100vh; }
    a { color: inherit; text-decoration: none; }
    a:hover { opacity: 0.8; }
    .container { max-width: 1200px; margin: 0 auto; padding: 0 20px; }
    .btn { display: inline-block; padding: 8px 20px; border-radius: 6px; font-size: 14px; cursor: pointer; border: none; transition: all 0.2s; }
    .btn-primary { background: #10b981; color: #fff; }
    .btn-primary:hover { background: #059669; }
    .btn-outline { background: transparent; border: 1px solid #333; color: #fff; }
    .btn-outline:hover { border-color: #555; }
    .model-card { background: #111; border: 1px solid #222; border-radius: 8px; padding: 20px; transition: all 0.2s; }
    .model-card:hover { border-color: #333; }
    .tag { display: inline-block; padding: 2px 8px; background: #222; border-radius: 4px; font-size: 12px; color: #888; }
    .tag-active { background: #10b98120; color: #10b981; }
  </style>
</head>

      <!-- 分页 -->

    function renderModels() {
      const list = document.getElementById('modelList');
      list.innerHTML = MODELS.map(m => {
        let priceHtml = '';
        if (m.type === 'token') {
          priceHtml = `
            <div class="text-sm text-zinc-400">输入价格 ¥${m.inputPrice} / 1M Tokens</div>
            <div class="text-sm text-zinc-400">补全价格 ¥${m.outputPrice} / 1M Tokens</div>
            <div class="text-sm text-zinc-400">缓存读取价格 ¥${m.cachePrice} / 1M Tokens</div>
            ${m.cacheCreate ? `<div class="text-sm text-zinc-400">缓存创建价格 ¥${m.cacheCreate} / 1M Tokens</div>` : ''}
          `;
        } else {
          priceHtml = `<div class="text-sm text-zinc-400">模型价格 ¥${m.inputPrice} / 次</div>`;
        }

        const tagsHtml = m.tags.map(t => `<span class="tag ${t === '按量计费' || t === '按次计费' || t === 'V' ? 'tag-active' : ''}">${t}</span>`).join(' ');

        return `
          <div class="model-card">
            <h3 class="text-lg font-semibold mb-2">${m.name}</h3>
            ${m.providerNote ? `<p class="text-xs text-zinc-500 mb-3">${m.providerNote}</p>` : ''}
            <div class="space-y-1 mb-4">
              ${priceHtml}
            </div>
            <div class="flex flex-wrap gap-2">
              ${tagsHtml}
            </div>
          </div>
        `;
      }).join('');
    }

    renderModels();
