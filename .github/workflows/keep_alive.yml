name: Keep TokenGo Alive

on:
  schedule:
    - cron: '*/3 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping TokenGo
        run: |
          curl -s -o /dev/null -w "Health: %{http_code}\n" https://tokengo-d0cb.onrender.com/health --max-time 10 || echo "Health endpoint failed"
          curl -s -o /dev/null -w "Root: %{http_code}\n" https://tokengo-d0cb.onrender.com/ --max-time 10 || echo "Root endpoint failed"
          curl -s -o /dev/null -w "Models: %{http_code}\n" https://tokengo-d0cb.onrender.com/v1/models --max-time 10 || echo "Models endpoint failed"
        timeout-minutes: 2